name: Waterwheel V0 Self Turn

on:
  workflow_dispatch:
  schedule:
    # 每5分钟自触发(GitHub 免费额度实际会限流到更慢,这正是要观测的)
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: waterwheel-single
  cancel-in-progress: false

jobs:
  turn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Turn the wheel one tick (build snake game)
        env:
          WHEEL_TRIGGER: ${{ github.event_name }}
          WHEEL_RUN_ID: ${{ github.run_id }}
        run: python tick.py
      - name: Commit the new state and game piece
        run: |
          git config user.name "waterwheel-v0"
          git config user.email "waterwheel-v0@users.noreply.github.com"
          git add -A state game
          git commit -m "wheel tick via ${{ github.event_name }} run ${{ github.run_id }}" || echo "no change"
          git push
